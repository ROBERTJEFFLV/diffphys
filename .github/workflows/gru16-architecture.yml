name: Multi-airframe physics and joint disturbance budget
on:
  push:
    branches: [codex/gru16-direct-readout-20260926]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: multi-airframe-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: .
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Archive the exact tested source
        run: git archive --format=tar HEAD > source.tar
      - uses: actions/upload-artifact@v4
        with:
          name: regression-source-${{ github.sha }}
          retention-days: 3
          path: source.tar
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install numpy pytest
      - name: Kernels, joint bounds, noisy gradients, failure handling and exact resume
        run: python -m pytest -q tests --junitxml=multi-airframe-tests.xml
      - name: Preserve verification evidence (CPU is not CUDA validation)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: multi-airframe-tests-${{ github.sha }}
          retention-days: 7
          path: |
            multi-airframe-tests.xml
            tests/core_contract.json
            docs/disturbance_budget.md
