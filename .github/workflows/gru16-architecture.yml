name: GRU16 architecture and preserved training contract
on:
  push:
    branches: [codex/gru16-direct-readout-20260926]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gru16-architecture-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: .
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Archive tracked source for reproducible regression checks
        run: git archive --format=tar HEAD > source.tar
      - uses: actions/upload-artifact@v4
        with:
          name: regression-source-${{ github.sha }}
          retention-days: 3
          path: source.tar
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install numpy pytest
      - name: Original regressions plus architecture and source-contract checks
        run: python -m pytest -q tests --junitxml=gru16-tests.xml
      - name: Bounded same-graph VJP audit (CPU is not CUDA validation)
        run: python tools/verify_vjp_acceleration.py --device cpu --horizon 8 --scenarios 64 --output gru16-vjp-audit.json
      - name: Preserve verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gru16-architecture-${{ github.sha }}
          retention-days: 7
          path: |
            gru16-tests.xml
            gru16-vjp-audit.json
            tests/gru16_parent_contract.json
            docs/gru16_direct_readout.md
