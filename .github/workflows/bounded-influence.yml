name: Physics group score CPU verification
on:
  push:
    branches: [codex/time-decay-bounded-influence-20260925]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: group-score-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: .
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: 17cfc62515cd2b500d0d00185c793bc68624af0c
          path: _baseline
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*.py
            /tools/*.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install numpy pytest
      - name: Regression tests
        run: python -m pytest -q tests --junitxml=group-tests.xml
      - name: One-backward physics-group probes
        run: python tools/verify_group_balance.py --baseline-root _baseline --output group-verification.json
      - name: Preserve sources and measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: physics-group-score-${{ github.sha }}
          retention-days: 7
          path: |
            *.py
            tools/*.py
            tests/*.py
            configs/*.args
            docs/physics_group_balance.md
            group-verification.json
            group-tests.xml
