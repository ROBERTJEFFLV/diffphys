name: Physics group gradient CPU verification
on:
  push:
    branches: [codex/time-decay-bounded-influence-20260925]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: group-gradient-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: .
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: 0417ad3bd5b546e7e9ed3bd813e19fdf19236f6d
          path: _baseline
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*.py
            /tools/*.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install numpy pytest
      - name: Regression tests (CUDA skips reported)
        run: python -m pytest -q tests --junitxml=group-tests.xml
      - name: Existing group-gradient H500 probes
        run: python tools/verify_group_balance.py --baseline-root _baseline --repeats 1 --output group-gradient-verification.json
      - name: Unchanged default and preserved Adam
        run: python tools/verify_vjp_acceleration.py --device cpu --horizon 8 --scenarios 64 --baseline-root _baseline --output vjp-acceleration-audit.json
      - name: Rejected single-adjoint research probe
        run: python tools/probe_group_capture.py --output capture-probe.json
      - name: Preserve sources and measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gru-vjp-audit-${{ github.sha }}
          retention-days: 7
          path: |
            *.py
            tools/*.py
            tests/*.py
            configs/*.args
            docs/gru_vjp_acceleration.md
            group-gradient-verification.json
            vjp-acceleration-audit.json
            capture-probe.json
            group-tests.xml
