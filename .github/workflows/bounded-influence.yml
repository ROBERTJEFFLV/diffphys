name: Bounded influence CPU verification
on:
  push:
    branches: [codex/time-decay-bounded-influence-20260925]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bounded-influence-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: .
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: 1564d25a210c139a94431fc6ae59d10cc0430ffe
          path: _baseline
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*.py
            /tools/*.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install numpy pytest
      - name: Existing and added regressions
        run: python -m pytest -q tests
      - name: Bounded production probes
        run: python tools/verify_bounded_influence.py --baseline-root _baseline --output verification-results.json
      - name: Preserve verification sources and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bounded-influence-${{ github.sha }}
          retention-days: 7
          path: |
            *.py
            tools/*.py
            tests/*.py
            configs/*.args
            docs/bounded_influence.md
            verification-results.json
